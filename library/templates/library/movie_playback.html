{% extends "library/base.html" %}
{% load static %}
{% block head_extra %}
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
/* Reset page padding for fullscreen */
body.playback-page {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
.site-header, .site-footer {
    display: none !important;
}
.content {
    padding: 0 !important;
}

/* Player UI */
.fullscreen-playback {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #000;
    z-index: 9999;
}
.custom-player-container {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
#video-player {
    width: 100%;
    height: 100%;
    max-width: none !important;
    max-height: none !important;
    border-radius: 0 !important;
    object-fit: contain;
    outline: none;
    cursor: pointer;
}

video::cue {
    background-color: transparent !important;
    background: transparent !important;
    color: white !important;
    text-shadow: 2px 2px 4px black, 0 0 1.5em black, 0 0 0.5em black !important;
    font-size: 2rem !important;
}

@media (max-width: 1024px) {
    video::cue {
        font-size: 1.3rem !important;
    }
}
@media (max-width: 600px) {
    video::cue {
        font-size: 1.1rem !important;
    }
}

::-webkit-media-text-track-display,
::-webkit-media-text-track-container,
::-webkit-media-text-track-background,
::-webkit-media-text-track-window,
::-webkit-media-text-track-region {
    background: transparent !important;
    background-color: transparent !important;
}

.playback-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    padding: 40px 30px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    box-sizing: border-box;
}
.back-link {
    color: #fff;
    font-size: 1.2rem;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 500;
    pointer-events: auto;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.back-link:hover {
    text-decoration: underline;
}

.player-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
    padding: 0 40px 30px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 20;
    box-sizing: border-box;
}

.custom-player-container:hover .playback-overlay,
.custom-player-container.paused .playback-overlay,
.custom-player-container.active .playback-overlay,
.custom-player-container:hover .player-controls,
.custom-player-container.paused .player-controls,
.custom-player-container.active .player-controls {
    opacity: 1;
}

.custom-player-container.idle:not(.paused) .playback-overlay,
.custom-player-container.idle:not(.paused) .player-controls {
    opacity: 0 !important;
    pointer-events: none;
}

.custom-player-container.idle:not(.paused),
.custom-player-container.idle:not(.paused) * {
    cursor: none !important;
}

.progress-bar-container {
    width: 100%;
    height: 4px;
    background: rgba(255, 255, 255, 0.3);
    cursor: pointer;
    position: relative;
    transition: height 0.15s ease;
}
.progress-bar-container:hover {
    height: 8px;
}
    .progress-bar-container:not(.dragging) .progress-bar-filled {
        transition: width 0.1s linear;
    }
    .progress-bar-thumb {
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%) scale(0);
        width: 12px;
        height: 12px;
        background: var(--accent-neon-red, #ff0000);
        border-radius: 50%;
        transition: transform 0.2s ease;
        pointer-events: none;
    }
    .progress-bar-container:hover .progress-bar-thumb,
    .progress-bar-container.dragging .progress-bar-thumb {
        transform: translateY(-50%) scale(1);
    }
.progress-bar-filled {
    height: 100%;
    background: var(--accent-crimson, #e50914);
    border-radius: 5px;
    width: 0%;
    position: relative;
}

.volume-container {
    display: inline-flex;
    align-items: center;
    position: relative;
    padding-right: 10px;
}
.volume-slider-wrapper {
    width: 0;
    overflow: hidden;
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    opacity: 0;
}
.volume-container:hover .volume-slider-wrapper {
    width: 80px;
    padding-left: 8px;
    opacity: 1;
}
#volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    outline: none;
    cursor: pointer;
}
#volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-crimson, #e50914);
    cursor: pointer;
    box-shadow: 0 0 10px var(--accent-crimson, #e50914);
    transition: transform 0.1s, box-shadow 0.1s;
}
#volume-slider::-webkit-slider-thumb:hover {
    transform: scale(1.3);
    box-shadow: 0 0 15px var(--accent-crimson, #e50914);
}
.progress-bar-container:hover .progress-bar-filled::after {
    content: '';
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    background: var(--accent-crimson, #e50914);
    border-radius: 50%;
    box-shadow: 0 0 5px rgba(0,0,0,0.5);
}

.control-buttons {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 5px;
}
.control-buttons-left,
.control-buttons-right {
    display: flex;
    align-items: center;
    gap: 30px;
}
.player-btn {
    background: transparent;
    border: none;
    color: white;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, color 0.2s ease;
}
.player-btn:hover {
    transform: scale(1.15);
}
.player-btn i {
    font-size: 32px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}
.time-display {
    color: white;
    font-size: 1.1rem;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

.settings-menu-container {
    position: relative;
}
.settings-menu {
    position: absolute;
    bottom: 60px;
    right: -20px;
    background: rgba(28, 28, 28, 0.95);
    border-radius: 12px;
    min-width: 280px;
    display: none;
    flex-direction: column;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    overflow-y: auto;
    overflow-x: hidden;
    max-height: 50vh;
    color: #eee;
    font-size: 14px;
    padding: 8px 0;
    backdrop-filter: blur(10px);
}
.settings-menu::-webkit-scrollbar {
    width: 6px;
}
.settings-menu::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
}
.settings-menu.active {
    display: flex;
}
.settings-item {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.2s;
    justify-content: space-between;
}
.settings-item:hover {
    background: rgba(255, 255, 255, 0.1);
}
.settings-item-left {
    display: flex;
    align-items: center;
    gap: 15px;
}
.settings-item-left i {
    font-size: 20px;
    width: 24px;
    text-align: center;
}
.settings-item-right {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #aaa;
    font-size: 0.9rem;
}
.settings-header {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px 16px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 4px;
    font-weight: 500;
}
.settings-header:hover {
    background: rgba(255, 255, 255, 0.1);
}
.settings-option {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    cursor: pointer;
    gap: 15px;
}
.settings-option:hover {
    background: rgba(255, 255, 255, 0.1);
}
.settings-option .check-icon {
    width: 24px;
    visibility: hidden;
    font-size: 20px;
}
.settings-option.active .check-icon {
    visibility: visible;
}

@media (max-width: 768px) {
    .player-controls {
        padding: 0 15px 15px !important;
    }
    .control-buttons-left, .control-buttons-right {
        gap: 15px !important;
    }
    .player-btn i {
        font-size: 24px !important;
    }
    .time-display {
        font-size: 0.9rem !important;
    }
    .settings-menu {
        bottom: 50px !important;
        right: -10px !important;
        min-width: 240px !important;
    }
    .playback-overlay {
        padding: 20px 15px !important;
    }
    .back-link {
        font-size: 1rem !important;
    }
}

/* Loading Spinner - Custom Equalizer Wave */
.loading-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none; /* Changed to flex via JS */
    align-items: center;
    justify-content: center;
    gap: 6px;
    z-index: 50;
    pointer-events: none;
}
.loading-spinner .bar {
    width: 6px;
    height: 10px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 3px;
    animation: eq 1s ease-in-out infinite;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}
.loading-spinner .bar:nth-child(2) { animation-delay: 0.15s; }
.loading-spinner .bar:nth-child(3) { animation-delay: 0.3s; }
.loading-spinner .bar:nth-child(4) { animation-delay: 0.45s; }

@keyframes eq {
    0%, 100% { height: 12px; opacity: 0.5; }
    50% { height: 40px; opacity: 1; }
}

/* Ensure native subtitles render above custom controls */
video::-webkit-media-text-track-display {
    transform: translateY(-80px) !important;
}
video::cue {
    transform: translateY(-80px) !important;
}
</style>
{% endblock %}
{% block body_class %}playback-page{% endblock %}
{% block content %}
<div class="fullscreen-playback">
    <div class="custom-player-container paused" id="player-container">
        <div class="playback-overlay" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="{% url 'movie_detail' movie.pk %}" class="back-link" style="flex-shrink: 0; margin-right: 20px;"><i class="bi bi-arrow-left"></i> Back to Movie</a>
            <h2 style="color: white; margin: 0; font-weight: 400; font-size: 1.2rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right;">{{ movie.title }} ({{ movie.release_date.year }})</h2>
        </div>
        
        <div class="loading-spinner" id="loading-spinner">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <video id="video-player" playsinline autoplay poster="{{ movie.poster_url }}" onclick="togglePlay()">
            {% if fallback_file and not hls_playlist %}
            <source src="{{ fallback_file }}" type="{{ fallback_type }}">
            {% endif %}
            {% for sub in subtitles %}
            <track kind="subtitles" label="{{ sub.label }}" srclang="{{ sub.srclang }}" src="{{ sub.url }}" {% if forloop.first %}default{% endif %}>
            {% endfor %}
            {% if movie.subtitle_file %}
            <track kind="subtitles" label="English" srclang="en" src="{% static movie.subtitle_file %}">
            {% endif %}
        </video>
        
        <div class="player-controls">
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar-filled" id="progress-filled">
                    <div class="progress-bar-thumb"></div>
                </div>
            </div>
            <div class="control-buttons">
                <div class="control-buttons-left">
                    <button class="player-btn" id="play-btn" onclick="togglePlay()">
                        <i class="bi bi-play-fill"></i>
                    </button>
                    <div class="volume-container">
                        <button class="player-btn" id="mute-btn" onclick="toggleMute()">
                            <i class="bi bi-volume-up-fill"></i>
                        </button>
                        <div class="volume-slider-wrapper">
                            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
                        </div>
                    </div>
                    <span class="time-display"><span id="current-time">0:00</span> <span style="opacity:0.5; margin:0 5px;">/</span> <span id="duration" style="opacity:0.5;">0:00</span></span>
                </div>
                <div class="control-buttons-right">
                    <button class="player-btn" id="aspect-btn" onclick="toggleAspect()" title="Toggle Fit/Fill">
                        <i class="bi bi-aspect-ratio-fill"></i>
                    </button>
                    <div class="settings-menu-container">
                        <button class="player-btn" id="settings-btn" onclick="toggleSettings(event)">
                            <i class="bi bi-gear-fill"></i>
                        </button>
                        <div class="settings-menu" id="settings-menu">
                            <!-- Quality options will be injected here -->
                        </div>
                    </div>
                    <button class="player-btn" id="fullscreen-btn" onclick="toggleFullscreen()">
                        <i class="bi bi-fullscreen"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const userIsRegistered = {{ request.user.is_authenticated|yesno:"true,false" }};
const backendDuration = {{ movie.duration.total_seconds|default:"0" }};

const video = document.getElementById('video-player');
const container = document.getElementById('player-container');
const playBtn = document.getElementById('play-btn');
const progressContainer = document.getElementById('progress-container');
const progressFilled = document.getElementById('progress-filled');
const currentTimeDisplay = document.getElementById('current-time');
const durationDisplay = document.getElementById('duration');
const muteBtn = document.getElementById('mute-btn');
const settingsMenu = document.getElementById('settings-menu');
const aspectBtn = document.getElementById('aspect-btn');
const loadingSpinner = document.getElementById('loading-spinner');
let hls;
let isCover = true;
aspectBtn.innerHTML = '<i class="bi bi-aspect-ratio-fill"></i>';

function toggleAspect() {
    isCover = !isCover;
    if(isCover) {
        video.style.objectFit = 'cover';
        aspectBtn.innerHTML = '<i class="bi bi-aspect-ratio-fill"></i>';
    } else {
        video.style.objectFit = 'contain';
        aspectBtn.innerHTML = '<i class="bi bi-aspect-ratio"></i>';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const source = '{% if hls_playlist %}{{ hls_playlist }}{% else %}{{ fallback_file|default:"" }}{% endif %}';
    
    if (source.indexOf('.m3u8') !== -1 && Hls.isSupported()) {
        hls = new Hls({
            enableWorker: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            backBufferLength: 30,
            maxBufferHole: 0.5,
        });
        hls.loadSource(source);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
            buildSettingsMenu(hls);
            video.play().catch(e => console.log("Autoplay blocked:", e));
        });
        
        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                alert("Playback Error: " + data.details);
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;
                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;
                    default:
                        hls.destroy();
                        break;
                }
            }
        });
    } else if (source.indexOf('.m3u8') !== -1 && video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari/iOS can play HLS natively even when MediaSource (hls.js) is unavailable.
        video.src = source;
        video.play().catch(e => console.log("Autoplay blocked:", e));
    } else if (source.indexOf('.m3u8') !== -1) {
        // Avoid assigning an HLS playlist to browsers that cannot play it.
        alert("This browser cannot play HLS video. Try Safari on iPhone/iPad or a browser with MediaSource support.");
    }
});

video.addEventListener('waiting', () => { loadingSpinner.style.display = 'flex'; });
video.addEventListener('playing', () => { loadingSpinner.style.display = 'none'; });
video.addEventListener('canplay', () => { loadingSpinner.style.display = 'none'; });

let settingsView = 'main';
let selectedQualityIndex = -1;
let subtitleOffset = 0;

function adjustSubSync(delta, event, reset = false) {
    if (event) event.stopPropagation();
    if (reset) {
        subtitleOffset = 0;
    } else {
        subtitleOffset += delta;
    }
    const valSpan = document.getElementById('sub-sync-val');
    if(valSpan) valSpan.innerText = (subtitleOffset > 0 ? '+' : '') + subtitleOffset.toFixed(1) + 's';
    applySubtitleOffset();
}

function applySubtitleOffset() {
    const textTracks = video.textTracks;
    if (!textTracks) return;
    for (let i = 0; i < textTracks.length; i++) {
        const cues = textTracks[i].cues;
        if (cues) {
            for (let j = 0; j < cues.length; j++) {
                let cue = cues[j];
                if (cue.originalStartTime === undefined) {
                    cue.originalStartTime = cue.startTime;
                    cue.originalEndTime = cue.endTime;
                }
                cue.startTime = cue.originalStartTime + subtitleOffset;
                cue.endTime = cue.originalEndTime + subtitleOffset;
            }
        }
    }
}

document.querySelectorAll('track').forEach(trackEl => {
    trackEl.addEventListener('load', applySubtitleOffset);
});

function buildSettingsMenu(hlsInstance) {
    settingsMenu.innerHTML = '';
    
    if (settingsView === 'main') {
        let activeAudio = "Default Track";
        if (hlsInstance && hlsInstance.audioTracks && hlsInstance.audioTracks.length > 0) {
            const track = hlsInstance.audioTracks[hlsInstance.audioTrack !== -1 ? hlsInstance.audioTrack : 0];
            if (track) activeAudio = track.name || track.language || `Track ${track.id}`;
        } else if (video.audioTracks && video.audioTracks.length > 0) {
            for(let i=0; i<video.audioTracks.length; i++) {
                if(video.audioTracks[i].enabled) {
                    activeAudio = video.audioTracks[i].label || video.audioTracks[i].language || `Track ${i+1}`;
                }
            }
        }
        activeAudio = activeAudio.replace(/^\d+_+/g, ''); // Clean up names like 0_Spa -> Spa
        
        let activeSub = "Off";
        const textTracks = video.textTracks;
        if (textTracks) {
            for(let i=0; i<textTracks.length; i++) {
                if(textTracks[i].mode === 'showing') {
                    activeSub = textTracks[i].label || textTracks[i].language || `Track ${i+1}`;
                }
            }
        }
        activeSub = activeSub.replace(/^\d+_+/g, ''); // Clean up 0_Spa
        
        let activeQual = "Auto";
        if (hlsInstance && hlsInstance.levels) {
            if (selectedQualityIndex === -1) {
                if (hlsInstance.currentLevel !== -1 && hlsInstance.levels[hlsInstance.currentLevel]) {
                    activeQual = `Auto (${hlsInstance.levels[hlsInstance.currentLevel].height}p)`;
                }
            } else {
                if (hlsInstance.levels[selectedQualityIndex]) {
                    activeQual = hlsInstance.levels[selectedQualityIndex].height + 'p';
                }
            }
        }

        settingsMenu.appendChild(createMainItem('Audio track', activeAudio, 'bi-music-note-beamed', () => { settingsView = 'audio'; buildSettingsMenu(hlsInstance); }));
        settingsMenu.appendChild(createMainItem('Subtitles/CC', activeSub, 'bi-badge-cc', () => { settingsView = 'subtitles'; buildSettingsMenu(hlsInstance); }));
        settingsMenu.appendChild(createMainItem('Subtitle Sync', (subtitleOffset > 0 ? '+' : '') + subtitleOffset.toFixed(1) + 's', 'bi-stopwatch', () => { settingsView = 'subsync'; buildSettingsMenu(hlsInstance); }));
        settingsMenu.appendChild(createMainItem('Quality', activeQual, 'bi-sliders', () => { settingsView = 'quality'; buildSettingsMenu(hlsInstance); }));
        
    } else {
        const header = document.createElement('div');
        header.className = 'settings-header';
        header.innerHTML = `<i class="bi bi-chevron-left"></i> <span>${settingsView.charAt(0).toUpperCase() + settingsView.slice(1)}</span>`;
        header.onclick = (e) => { 
            e.stopPropagation();
            settingsView = 'main'; 
            buildSettingsMenu(hlsInstance); 
        };
        settingsMenu.appendChild(header);
        
        if (settingsView === 'quality') {
            if (hlsInstance && hlsInstance.levels) {
                settingsMenu.appendChild(createOptionItem('Auto', selectedQualityIndex === -1, () => {
                    selectedQualityIndex = -1;
                    hlsInstance.currentLevel = -1;
                    settingsView = 'main'; buildSettingsMenu(hlsInstance);
                }));
                const sortedLevels = hlsInstance.levels.map((l, i) => ({...l, index: i})).sort((a,b) => b.height - a.height);
                sortedLevels.forEach(level => {
                    settingsMenu.appendChild(createOptionItem(level.height + 'p', selectedQualityIndex === level.index, () => {
                        selectedQualityIndex = level.index;
                        hlsInstance.currentLevel = level.index;
                        settingsView = 'main'; buildSettingsMenu(hlsInstance);
                    }));
                });
            } else {
                settingsMenu.appendChild(createOptionItem('Auto', true, () => {}));
            }
        }
        
        else if (settingsView === 'audio') {
            if (hlsInstance && hlsInstance.audioTracks) {
                hlsInstance.audioTracks.forEach(track => {
                    const isSelected = hlsInstance.audioTrack === track.id;
                    let name = track.name || track.language || `Track ${track.id}`;
                    name = name.replace(/^\d+_+/g, '');
                    settingsMenu.appendChild(createOptionItem(name, isSelected, () => {
                        hlsInstance.audioTrack = track.id;
                        settingsView = 'main'; buildSettingsMenu(hlsInstance);
                    }));
                });
            } else if (video.audioTracks && video.audioTracks.length > 0) {
                for(let i=0; i<video.audioTracks.length; i++) {
                    const track = video.audioTracks[i];
                    const isSelected = track.enabled;
                    let name = track.label || track.language || `Track ${i+1}`;
                    name = name.replace(/^\d+_+/g, '');
                    settingsMenu.appendChild(createOptionItem(name, isSelected, () => {
                        for(let j=0; j<video.audioTracks.length; j++) video.audioTracks[j].enabled = false;
                        track.enabled = true;
                        settingsView = 'main'; buildSettingsMenu(hlsInstance);
                    }));
                }
            } else {
                settingsMenu.appendChild(createOptionItem('Default Track', true, () => {}));
            }
        }
        
        else if (settingsView === 'subtitles') {
            let hasActiveSub = false;
            const textTracks = video.textTracks;
            if(textTracks) {
                for(let i=0; i<textTracks.length; i++) {
                    if(textTracks[i].mode === 'showing') hasActiveSub = true;
                }
            }
            
            settingsMenu.appendChild(createOptionItem('Off', !hasActiveSub, () => {
                for(let i=0; i<video.textTracks.length; i++) video.textTracks[i].mode = 'hidden';
                settingsView = 'main'; buildSettingsMenu(hlsInstance);
            }));
            
            if(textTracks) {
                let trackList = [];
                for(let i=0; i<textTracks.length; i++) {
                    const track = textTracks[i];
                    let name = track.label || track.language || `Track ${i+1}`;
                    name = name.replace(/^\d+_+/g, '');
                    trackList.push({track: track, name: name});
                }
                
                trackList.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));
                
                trackList.forEach(item => {
                    settingsMenu.appendChild(createOptionItem(item.name, item.track.mode === 'showing', () => {
                        for(let j=0; j<video.textTracks.length; j++) video.textTracks[j].mode = 'hidden';
                        item.track.mode = 'showing';
                        applySubtitleOffset();
                        settingsView = 'main'; buildSettingsMenu(hlsInstance);
                    }));
                });
            }
        }
        else if (settingsView === 'subsync') {
            const syncContainer = document.createElement('div');
            syncContainer.style.padding = '20px';
            syncContainer.style.textAlign = 'center';
            syncContainer.style.color = 'white';
            syncContainer.innerHTML = `
                <div style="margin-bottom: 15px; font-size: 1.1rem;">Subtitle Delay</div>
                <div style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                    <button class="player-btn" onclick="adjustSubSync(-0.5, event)" style="background: rgba(255,255,255,0.1); border-radius: 5px; padding: 5px 15px; width: auto; height: auto;">-0.5s</button>
                    <span id="sub-sync-val" style="font-size: 1.2rem; min-width: 60px;">${(subtitleOffset > 0 ? '+' : '') + subtitleOffset.toFixed(1)}s</span>
                    <button class="player-btn" onclick="adjustSubSync(0.5, event)" style="background: rgba(255,255,255,0.1); border-radius: 5px; padding: 5px 15px; width: auto; height: auto;">+0.5s</button>
                </div>
                <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: 15px;">
                    <button class="player-btn" onclick="adjustSubSync(-0.1, event)" style="background: rgba(255,255,255,0.1); border-radius: 5px; padding: 5px 10px; width: auto; height: auto; font-size: 0.9rem;">-0.1s</button>
                    <button class="player-btn" onclick="adjustSubSync(0.1, event)" style="background: rgba(255,255,255,0.1); border-radius: 5px; padding: 5px 10px; width: auto; height: auto; font-size: 0.9rem;">+0.1s</button>
                </div>
                <div style="margin-top: 15px;">
                    <button class="player-btn" onclick="adjustSubSync(0, event, true)" style="font-size: 0.9rem; opacity: 0.7; width: auto; height: auto;">Reset</button>
                </div>
            `;
            settingsMenu.appendChild(syncContainer);
        }
    }
}

function createMainItem(title, value, iconClass, onClick) {
    const item = document.createElement('div');
    item.className = 'settings-item';
    item.innerHTML = `
        <div class="settings-item-left"><i class="bi ${iconClass}"></i> ${title}</div>
        <div class="settings-item-right">${value} <i class="bi bi-chevron-right"></i></div>
    `;
    item.onclick = (e) => {
        e.stopPropagation();
        onClick();
    };
    return item;
}

function createOptionItem(title, isActive, onClick) {
    const item = document.createElement('div');
    item.className = 'settings-option';
    if(isActive) item.classList.add('active');
    item.innerHTML = `<i class="bi bi-check check-icon"></i> ${title}`;
    item.onclick = (e) => {
        e.stopPropagation();
        onClick();
    };
    return item;
}

function togglePlay() {
    if (video.paused) {
        video.play();
    } else {
        video.pause();
    }
}

const volumeSlider = document.getElementById('volume-slider');

volumeSlider.addEventListener('input', (e) => {
    video.volume = e.target.value;
    video.muted = (e.target.value == 0);
    updateVolumeIcon();
});

function updateVolumeIcon() {
    if (video.muted || video.volume === 0) {
        muteBtn.innerHTML = '<i class="bi bi-volume-mute-fill"></i>';
    } else if (video.volume < 0.5) {
        muteBtn.innerHTML = '<i class="bi bi-volume-down-fill"></i>';
    } else {
        muteBtn.innerHTML = '<i class="bi bi-volume-up-fill"></i>';
    }
}

function toggleMute() {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) {
        video.volume = 1;
        volumeSlider.value = 1;
    }
    updateVolumeIcon();
}

{% if user.is_authenticated %}
let lastSyncTime = 0;
video.addEventListener('timeupdate', () => {
    if (isDragging) return;
    const activeDuration = (isFinite(video.duration) && video.duration > 0) ? video.duration : backendDuration;
    const percent = activeDuration > 0 ? (video.currentTime / activeDuration) * 100 : 0;
    progressFilled.style.width = `${percent}%`;
    currentTimeDisplay.innerText = formatTime(video.currentTime);
    
    // Sync progress every 10 seconds
    const currentTime = video.currentTime;
    if (Math.abs(currentTime - lastSyncTime) > 10) {
        lastSyncTime = currentTime;
        const isFinished = activeDuration > 0 && (activeDuration - currentTime) < 30; // mark finished if < 30s left
        fetch("{% url 'api_update_progress' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                type: 'movie',
                id: {{ movie.pk }},
                timestamp: currentTime,
                is_finished: isFinished
            })
        });
    }
});
{% else %}
video.addEventListener('timeupdate', () => {
    if (isDragging) return;
    const activeDuration = (isFinite(video.duration) && video.duration > 0) ? video.duration : backendDuration;
    const percent = activeDuration > 0 ? (video.currentTime / activeDuration) * 100 : 0;
    progressFilled.style.width = `${percent}%`;
    currentTimeDisplay.innerText = formatTime(video.currentTime);
});
{% endif %}

let savedTimestamp = {{ saved_timestamp|default:0 }};
let hasResumed = false;

video.addEventListener('loadedmetadata', () => {
    const activeDuration = (isFinite(video.duration) && video.duration > 0) ? video.duration : backendDuration;
    durationDisplay.innerText = formatTime(activeDuration);
    if(savedTimestamp > 0 && !hasResumed) {
        video.currentTime = savedTimestamp;
        hasResumed = true;
    }
});

let isDragging = false;
let wasPlayingBeforeDrag = false;

function updateProgressUI(e) {
    const rect = progressContainer.getBoundingClientRect();
    let clientX = e.clientX;
    if (e.touches && e.touches.length > 0) clientX = e.touches[0].clientX;
    else if (e.changedTouches && e.changedTouches.length > 0) clientX = e.changedTouches[0].clientX;
    
    let posPercent = (clientX - rect.left) / rect.width;
    posPercent = Math.max(0, Math.min(1, posPercent));
    
    progressFilled.style.width = `${posPercent * 100}%`;
    
    const activeDuration = (isFinite(video.duration) && video.duration > 0) ? video.duration : backendDuration;
    currentTimeDisplay.innerText = formatTime(posPercent * activeDuration);
    return posPercent;
}

progressContainer.addEventListener('mousedown', (e) => { 
    isDragging = true; 
    progressContainer.classList.add('dragging');
    wasPlayingBeforeDrag = !video.paused;
    if (wasPlayingBeforeDrag) video.pause();
    updateProgressUI(e);
});

document.addEventListener('mousemove', (e) => { 
    if(isDragging) updateProgressUI(e);
});

document.addEventListener('mouseup', (e) => { 
    if(isDragging) {
        isDragging = false; 
        progressContainer.classList.remove('dragging');
        const posPercent = updateProgressUI(e);
        const activeDuration = (isFinite(video.duration) && video.duration > 0) ? video.duration : backendDuration;
        video.currentTime = posPercent * activeDuration;
        if (wasPlayingBeforeDrag) video.play().catch(err => console.log(err));
    }
});

progressContainer.addEventListener('touchstart', (e) => { 
    isDragging = true; 
    progressContainer.classList.add('dragging');
    wasPlayingBeforeDrag = !video.paused;
    if (wasPlayingBeforeDrag) video.pause();
    updateProgressUI(e);
});

progressContainer.addEventListener('touchmove', (e) => { 
    if(isDragging) { 
        e.preventDefault(); 
        updateProgressUI(e);
    }
}, {passive: false});

progressContainer.addEventListener('touchend', (e) => { 
    if(isDragging) {
        isDragging = false; 
        progressContainer.classList.remove('dragging');
        const posPercent = updateProgressUI(e);
        const activeDuration = (isFinite(video.duration) && video.duration > 0) ? video.duration : backendDuration;
        video.currentTime = posPercent * activeDuration;
        if (wasPlayingBeforeDrag) video.play().catch(err => console.log(err));
    }
});

function formatTime(seconds) {
    if(isNaN(seconds)) return "0:00";
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    if (h > 0) {
        return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        const req = container.requestFullscreen || container.webkitRequestFullscreen || container.mozRequestFullScreen || container.msRequestFullscreen;
        if (req) {
            req.call(container).then(() => {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(e => console.log(e));
                }
            }).catch(err => console.log(err));
        } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen(); // iOS fallback
        }
    } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if (exit) {
            exit.call(document).then(() => {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }).catch(err => console.log(err));
        }
    }
}

function toggleSettings(e) {
    e.stopPropagation();
    settingsView = 'main';
    buildSettingsMenu(hls);
    settingsMenu.classList.toggle('active');
}

document.addEventListener('keydown', (e) => {
    if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'textarea') return;
    switch(e.code) {
        case 'Space':
            e.preventDefault();
            togglePlay();
            break;
        case 'ArrowRight':
            e.preventDefault();
            video.currentTime = Math.min(video.currentTime + 10, video.duration || backendDuration);
            break;
        case 'ArrowLeft':
            e.preventDefault();
            video.currentTime = Math.max(video.currentTime - 10, 0);
            break;
        case 'KeyF':
            e.preventDefault();
            toggleFullscreen();
            break;
    }
});

document.addEventListener('click', (e) => {
    if (!settingsMenu.contains(e.target) && e.target.id !== 'settings-btn' && e.target.closest('#settings-btn') === null) {
        settingsMenu.classList.remove('active');
    }
});

video.addEventListener('play', () => {
    container.classList.remove('paused');
    playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>';
});
video.addEventListener('pause', () => {
    container.classList.add('paused');
    playBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
});

// Inactivity timer for hiding UI
let idleTimeout;

function resetIdleTimer() {
    container.classList.remove('idle');
    clearTimeout(idleTimeout);
    idleTimeout = setTimeout(() => {
        if(!video.paused) {
            container.classList.add('idle');
        }
    }, 3000); // 3 seconds of inactivity
}

container.addEventListener('mousemove', resetIdleTimer);
container.addEventListener('mousedown', resetIdleTimer);
container.addEventListener('touchstart', resetIdleTimer);
container.addEventListener('keydown', resetIdleTimer);
video.addEventListener('play', resetIdleTimer);

// Initial trigger
resetIdleTimer();

// Gamepad API Support
let gamepadState = {};
function pollGamepads() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
        const gp = gamepads[i];
        if (gp) {
            // Button 0 (A/Cross): Play/Pause
            if (gp.buttons[0].pressed && !gamepadState.btn0) {
                togglePlay();
                resetIdleTimer();
            }
            gamepadState.btn0 = gp.buttons[0].pressed;

            // Button 1 (B/Circle): Fullscreen
            if (gp.buttons[1].pressed && !gamepadState.btn1) {
                toggleFullscreen();
                resetIdleTimer();
            }
            gamepadState.btn1 = gp.buttons[1].pressed;

            // Button 2 (X/Square): Mute
            if (gp.buttons[2].pressed && !gamepadState.btn2) {
                toggleMute();
                resetIdleTimer();
            }
            gamepadState.btn2 = gp.buttons[2].pressed;

            // Button 12 (D-pad Up): Volume Up
            if (gp.buttons[12] && gp.buttons[12].pressed && !gamepadState.btn12) {
                video.volume = Math.min(video.volume + 0.1, 1);
                volumeSlider.value = video.volume;
                if (video.volume > 0) video.muted = false;
                updateVolumeIcon();
                resetIdleTimer();
            }
            if (gp.buttons[12]) gamepadState.btn12 = gp.buttons[12].pressed;

            // Button 13 (D-pad Down): Volume Down
            if (gp.buttons[13] && gp.buttons[13].pressed && !gamepadState.btn13) {
                video.volume = Math.max(video.volume - 0.1, 0);
                volumeSlider.value = video.volume;
                if (video.volume === 0) video.muted = true;
                updateVolumeIcon();
                resetIdleTimer();
            }
            if (gp.buttons[13]) gamepadState.btn13 = gp.buttons[13].pressed;

            // Button 14 (D-pad Left): Rewind 10s
            if (gp.buttons[14] && gp.buttons[14].pressed && !gamepadState.btn14) {
                video.currentTime = Math.max(video.currentTime - 10, 0);
                resetIdleTimer();
            }
            if (gp.buttons[14]) gamepadState.btn14 = gp.buttons[14].pressed;

            // Button 15 (D-pad Right): Forward 10s
            if (gp.buttons[15] && gp.buttons[15].pressed && !gamepadState.btn15) {
                video.currentTime = Math.min(video.currentTime + 10, video.duration || backendDuration);
                resetIdleTimer();
            }
            if (gp.buttons[15]) gamepadState.btn15 = gp.buttons[15].pressed;
        }
    }
    requestAnimationFrame(pollGamepads);
}

window.addEventListener("gamepadconnected", (e) => {
    console.log("Gamepad connected: " + e.gamepad.id);
    pollGamepads();
});
</script>
