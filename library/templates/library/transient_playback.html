{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ transient_title|default:"EdgeStream Stream" }}</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px system-ui,sans-serif}.top{position:fixed;z-index:2;top:0;left:0;right:0;padding:18px 22px;background:linear-gradient(#000c,transparent)}a{color:#fff;text-decoration:none}video{width:100vw;height:100vh;object-fit:contain;background:#000}.message{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);max-width:90vw;text-align:center;padding:18px;background:#171717;border-radius:12px;display:none}
</style></head><body><header class="top"><a href="{{ transient_back_url }}">← Back to streams</a><strong style="margin-left:18px">{{ transient_title|default:"Transient stream" }}</strong></header><video id="player" controls autoplay playsinline></video><div id="message" class="message" role="status"></div><script>
(()=>{const video=document.getElementById("player"),box=document.getElementById("message"),url="{{ transient_playback_url|escapejs }}";function message(text){box.textContent=text;box.style.display="block"}if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=url;video.addEventListener("error",()=>message("The HLS stream could not be played. Check that the stream session is still active."));}else if(window.Hls&&Hls.isSupported()){const hls=new Hls({enableWorker:true,lowLatencyMode:false});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)message("Playback failed. The stream may have expired or the source may be unavailable.");});}else{message("This browser does not support HLS playback.");}})();
</script></body></html>
